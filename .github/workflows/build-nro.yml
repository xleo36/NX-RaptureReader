name: Build Switch NRO

on:
  pull_request:
    types: [closed]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-nro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-nro:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Configure and build .nro
        run: |
          export PATH="/opt/devkitpro/devkitA64/bin:/opt/devkitpro/portlibs/switch/bin:/opt/devkitpro/tools/bin:$PATH"
          cmake -S . -B build/switch -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/switch -j"$(nproc)"
      - name: Verify .nro output
        run: |
          ls -lh build/switch/NX-RaptureReader.nro
          magic="$(dd if=build/switch/NX-RaptureReader.nro bs=1 skip=16 count=4 2>/dev/null)"
          test "$magic" = "NRO0"
      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('NX-RaptureReader-pr-{0}', github.event.pull_request.number) || format('NX-RaptureReader-run-{0}', github.run_number) }}
          path: build/switch/NX-RaptureReader.nro
          if-no-files-found: error
          retention-days: 30
