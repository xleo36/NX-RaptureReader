name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libfreetype-dev zlib1g-dev libwebp-dev
      - name: Check duplicated assets are in sync
        run: make check-assets
      - name: Build and run tests
        run: |
          make test
          make pc

  switch-nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Switch dependencies
        run: |
          dkp-pacman -Sy --noconfirm --needed \
            switch-sdl2 \
            switch-freetype \
            switch-zlib \
            switch-libwebp \
            switch-mupdf \
            switch-cmake \
            switch-pkg-config \
            switch-tools \
            libnx
      - name: Configure and build .nro
        run: |
          export PATH="/opt/devkitpro/portlibs/switch/bin:/opt/devkitpro/tools/bin:$PATH"
          cmake -S . -B build/switch -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/switch -j"$(nproc)"
      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX-RaptureReader-nro
          path: build/switch/NX-RaptureReader.nro
